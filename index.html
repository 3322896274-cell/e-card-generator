<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#fff3f2"><title>心意来信 · 专属电子贺卡</title>
<style>
*{box-sizing:border-box}body{margin:0;font:15px/1.65 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;background:#f8f5f4;color:#292329}button,input,textarea,select{font:inherit}button{cursor:pointer;border:0;border-radius:12px;padding:12px 16px;background:#292329;color:#fff}button.secondary{background:#f0e8e7;color:#633b47}button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid #b76e89;outline-offset:2px}header{max-width:1080px;margin:auto;padding:24px 20px 12px;display:flex;justify-content:space-between;align-items:center}header b{font-size:21px;letter-spacing:2px}small,.muted{color:#806e75;font-size:12px}main{max-width:1080px;margin:auto;padding:16px 20px 48px;display:grid;grid-template-columns:1fr 1fr;gap:24px;align-items:start}.panel{background:white;border:1px solid #eee7e5;border-radius:24px;padding:24px;box-shadow:0 10px 32px #52364209}h1,h2,p{margin:0 0 12px}h1{font-size:30px;line-height:1.25}h2{font-size:19px}label{display:block;margin:15px 0 6px;font-weight:600}input,textarea,select{display:block;width:100%;padding:10px 12px;border:1px solid #e3d9da;border-radius:10px;background:#fcfaf9;color:#30272d}textarea{resize:vertical;min-height:100px}input[type=file]{font-size:12px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px}.actions button{flex:1;min-width:112px}.share{margin-top:14px;overflow-wrap:anywhere}.share canvas,.share img{display:block;margin:15px auto;max-width:100%;height:auto}.theme{--bg:#ffe9e9;--bg2:#fff8ef;--ink:#78384b;--accent:#b94d6d;--paper:#fff9f3;position:relative;overflow:hidden;min-height:650px;border-radius:24px;background:radial-gradient(circle at 15% 10%,#fff7 0,transparent 28%),linear-gradient(145deg,var(--bg),var(--bg2));color:var(--ink);text-align:center;padding:36px 24px;isolation:isolate}.theme[data-theme=night]{--bg:#19203c;--bg2:#3c285b;--ink:#f8edf9;--accent:#e6b9e8;--paper:#2c2645}.theme[data-theme=green]{--bg:#dceee0;--bg2:#fff7e6;--ink:#315846;--accent:#4c8268;--paper:#fffdf3}.eyebrow{font-size:11px;letter-spacing:4px;text-transform:uppercase;opacity:.8}.cover{min-height:560px;display:flex;flex-direction:column;align-items:center;justify-content:center}.envelope{position:relative;width:190px;height:130px;background:#f7cfda;border-radius:10px;margin:34px auto 28px;box-shadow:0 18px 36px #63324324;display:grid;place-items:center;overflow:hidden;animation:bob 3s ease-in-out infinite}.envelope:before{content:"";position:absolute;inset:0;background:linear-gradient(135deg,#efadbf,#f8dce2);clip-path:polygon(0 0,100% 0,50% 67%)}.envelope:after{content:"";position:absolute;inset:0;background:#fce4e7;clip-path:polygon(0 0,50% 67%,100% 0,100% 100%,0 100%);opacity:.64}.seal{z-index:1;background:#ba4c6b;color:white;border-radius:100%;width:48px;height:48px;display:grid;place-items:center;font-size:24px}.theme button{background:var(--accent);color:#fff}.theme[data-theme=night] button{color:#302143}.letter{position:relative;z-index:2;animation:appear .65s both}.letter[hidden],.cover[hidden]{display:none}.message{background:var(--paper);padding:25px 20px;border-radius:18px;white-space:pre-wrap;text-align:left;line-height:2;overflow-wrap:anywhere;box-shadow:0 10px 30px #2213280c}.sign{text-align:right;margin:16px 0;font-size:13px}.photos{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin:22px 0}.photos img{width:100%;aspect-ratio:1;object-fit:cover;border:5px solid var(--paper);border-radius:8px;box-shadow:0 5px 12px #22132816}.audio{margin:14px 0}.audio audio{width:100%;max-width:360px}.confetti{position:absolute;pointer-events:none;inset:0;overflow:hidden;z-index:3}.particle{position:absolute;top:-25px;font-size:20px;animation:fall 3.4s ease-in forwards}.footer{font-size:11px;letter-spacing:2px;opacity:.7;margin-top:24px}.recipient header,.recipient .editor{display:none}.recipient main{display:block;max-width:540px;padding:0;min-height:100dvh}.recipient .theme{min-height:100dvh;border-radius:0;padding-top:max(36px,env(safe-area-inset-top));padding-bottom:max(36px,env(safe-area-inset-bottom))}.recipient .cover{min-height:calc(100dvh - 72px)}.recipient .preview-label{display:none}@keyframes bob{50%{transform:translateY(-8px)}}@keyframes appear{from{opacity:0;transform:translateY(15px)}to{opacity:1;transform:none}}@keyframes fall{to{transform:translate(var(--dx),780px) rotate(480deg);opacity:0}}@media(max-width:780px){main{grid-template-columns:1fr;padding:10px 14px 28px}header{padding:18px 16px 10px}.panel{padding:18px}.theme{min-height:580px}.cover{min-height:490px}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01s!important}}
</style></head>
<body><header><b>心意来信 ♡</b><small>把心意，寄给特别的人</small></header>
<main><section class="panel editor"><p class="eyebrow">MAKE A LITTLE SURPRISE</p><h1>有些话，值得<br>用特别的方式说。</h1><p class="muted">定制你的专属电子贺卡 · 无需登录 · 本地预览</p>
<label for="name">收件人</label><input id="name" maxlength="40" value="亲爱的你">
<label for="occasion">场景</label><select id="occasion"><option value="birthday">生日祝福</option><option value="anniversary">恋爱纪念日</option><option value="love">浪漫表白</option></select>
<label for="style">视觉主题</label><select id="style"><option value="pink">玫瑰奶油</option><option value="night">梦幻星空</option><option value="green">清新花园</option></select>
<label for="message">想对 TA 说的话</label><textarea id="message" maxlength="1000">愿你永远有快乐的理由，也永远有人陪你分享生活里的小事。生日快乐，今天的你值得所有美好。</textarea>
<label for="sender">来自</label><input id="sender" maxlength="40" value="一直在乎你的人">
<label for="photos">上传照片（最多 8 张）</label><input id="photos" type="file" accept="image/png,image/jpeg,image/webp,image/gif" multiple><small>本地文件会随 HTML 导出，不会自动上传到网络。</small>
<label for="photoUrls">或填写在线照片链接（每行一个 HTTPS 图片地址）</label><textarea id="photoUrls" placeholder="https://..." rows="2"></textarea>
<label for="music">背景音乐</label><input id="music" type="file" accept="audio/*"><input id="musicUrl" placeholder="或填写 HTTPS 音频直链" type="url">
<label for="voice">专属语音</label><input id="voice" type="file" accept="audio/*"><input id="voiceUrl" placeholder="或填写 HTTPS 音频直链" type="url"><div class="actions"><button class="secondary" id="record">录制语音</button></div>
<div class="actions"><button id="preview">刷新预览</button><button id="share">生成链接及二维码</button><button id="export" class="secondary">导出完整 HTML</button></div><div class="share" aria-live="polite"><p id="notice" class="muted">分享链接支持文字及在线媒体地址；本地照片或录音请导出 HTML，或先使用经授权的网络存储。</p><input id="shareUrl" readonly hidden aria-label="分享链接"><div class="actions" id="copyWrap" hidden><button class="secondary" id="copy">复制链接</button></div><div id="qr"></div></div></section>
<section><p class="preview-label muted">手机端效果预览 · 点击信封拆开惊喜</p><div class="theme" id="card" data-theme="pink"><div class="confetti" id="confetti" aria-hidden="true"></div><div class="cover" id="cover"><p class="eyebrow">A LETTER FOR YOU</p><div class="envelope" aria-hidden="true"><span class="seal">♡</span></div><h1 id="coverName">亲爱的你</h1><p>你有一封特别的来信</p><button id="open">点击拆开信封</button><p class="footer">ONLY FOR YOU · 仅为你而写</p></div><article class="letter" id="letter" hidden><p class="eyebrow" id="english"></p><div id="symbol" style="font-size:58px;margin:20px 0 4px"></div><h1 id="heading"></h1><p id="to"></p><div class="message" id="words"></div><p class="sign" id="sign"></p><div class="photos" id="gallery"></div><div class="audio" id="musicBox" hidden><p>♫ 专属背景音乐</p><audio id="bg" controls loop preload="none"></audio></div><div class="audio" id="voiceBox" hidden><p>一段只想对你说的话</p><audio id="voicePlayer" controls preload="none"></audio></div><button id="celebrate">再放一次礼花 ♡</button><p class="footer">心意来信 · MADE WITH LOVE</p></article></div></section></main>
<script id="embedded" type="application/json">null</script>
<script id="qrlib" src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js" defer></script>
<script>
'use strict';
const $=id=>document.getElementById(id), themes=['pink','night','green'], occasions={birthday:['HAPPY BIRTHDAY','生日快乐！','🎂'],anniversary:['HAPPY ANNIVERSARY','纪念日快乐！','💗'],love:['JUST FOR YOU','想把喜欢告诉你','💌']};
let files={photos:[],music:'',voice:''},current=null,recorder=null,stream=null,recordingPromise=null,pending=0,readErrors={};
const safe=(s,kind)=>{if(typeof s!=='string')return '';if(/^https:\/\//i.test(s)){try{const u=new URL(s);return u.protocol==='https:'?u.href:''}catch{return ''}}if(kind==='image'&&/^data:image\/(png|jpeg|webp|gif);base64,/i.test(s))return s;if(kind==='audio'&&/^data:audio\/[a-z0-9.+-]+(?:;[^,]*)?;base64,/i.test(s))return s;return ''};
function normalize(d){d=d||{};const str=(v,n)=>typeof v==='string'?v.slice(0,n):'';return {name:str(d.name,40)||'亲爱的你',sender:str(d.sender,40),message:str(d.message,1000),occasion:Object.hasOwn(occasions,d.occasion)?d.occasion:'birthday',theme:themes.includes(d.theme)?d.theme:'pink',photos:(Array.isArray(d.photos)?d.photos:[]).slice(0,8).map(s=>safe(s,'image')).filter(Boolean),music:safe(d.music,'audio'),voice:safe(d.voice,'audio')}}
function collect(){return normalize({name:$('name').value,sender:$('sender').value,message:$('message').value,occasion:$('occasion').value,theme:$('style').value,photos:[...files.photos,...$('photoUrls').value.split(/\n/).map(s=>s.trim()).filter(Boolean)],music:files.music||$('musicUrl').value.trim(),voice:files.voice||$('voiceUrl').value.trim()})}
function audio(id,box,url){const a=$(id);a.pause();a.removeAttribute('src');if(url)a.src=url;$(box).hidden=!url}
function render(d,opened=false){current=normalize(d);const [en,head,symbol]=occasions[current.occasion];$('card').dataset.theme=current.theme;$('coverName').textContent=current.name;$('english').textContent=en;$('heading').textContent=head;$('symbol').textContent=symbol;$('to').textContent='To '+current.name;$('words').textContent=current.message;$('sign').textContent=current.sender?'—— '+current.sender:'';$('gallery').replaceChildren();current.photos.forEach((src,i)=>{const img=document.createElement('img');img.alt='珍贵回忆 '+(i+1);img.referrerPolicy='no-referrer';img.src=src;img.loading='lazy';$('gallery').append(img)});audio('bg','musicBox',current.music);audio('voicePlayer','voiceBox',current.voice);$('cover').hidden=opened;$('letter').hidden=!opened}
function fireworks(){const c=$('confetti');c.replaceChildren();for(let i=0;i<40;i++){const e=document.createElement('span');e.className='particle';e.textContent=['♡','✦','♥','✧','🎉'][i%5];e.style.left=Math.random()*100+'%';e.style.color=['#e7749e','#f7c65f','#b385cf','#f19f9f'][i%4];e.style.setProperty('--dx',(Math.random()*120-60)+'px');e.style.animationDelay=Math.random()*1.1+'s';c.append(e);e.addEventListener('animationend',()=>e.remove())}}
$('open').onclick=()=>{$('cover').hidden=true;$('letter').hidden=false;fireworks();if(current.music)$('bg').play().catch(()=>{})};$('celebrate').onclick=fireworks;$('voicePlayer').addEventListener('play',()=>$('bg').pause());
function notice(s){$('notice').textContent=s}function read(f){return new Promise((resolve,reject)=>{if(f.size>15*1024*1024)return reject(Error('单个文件请小于 15 MB'));const r=new FileReader();r.onload=()=>resolve(r.result);r.onerror=()=>reject(Error('文件读取失败'));r.readAsDataURL(f)})}
function bindFile(id,kind,multi){$(id).onchange=async()=>{pending++;delete readErrors[kind];try{const list=[...$(id).files].slice(0,multi?8:1);files[kind]=multi?await Promise.all(list.map(read)):list[0]?await read(list[0]):'';render(collect());notice('文件已读取，可以预览或导出。')}catch(e){files[kind]=multi?[]:'';readErrors[kind]=e.message;notice(e.message)}finally{pending--}}}
bindFile('photos','photos',true);bindFile('music','music',false);bindFile('voice','voice',false);
$('record').onclick=async()=>{if(recorder&&recorder.state==='recording'){recorder.stop();$('record').textContent='正在保存';return}if(!navigator.mediaDevices?.getUserMedia||!window.MediaRecorder){notice('当前浏览器不支持录音，请上传音频文件。');return}if(recordingPromise)return;recordingPromise=true;try{stream=await navigator.mediaDevices.getUserMedia({audio:true});recorder=new MediaRecorder(stream);const chunks=[];recorder.ondataavailable=e=>{if(e.data.size)chunks.push(e.data)};recorder.onstop=async()=>{pending++;try{files.voice=await read(new Blob(chunks,{type:recorder.mimeType||'audio/webm'}));delete readErrors.voice;render(collect());notice('录音已保存。')}catch(e){notice(e.message)}finally{pending--;stream.getTracks().forEach(t=>t.stop());$('record').textContent='重新录制语音';recordingPromise=null}};recorder.start();$('record').textContent='停止录音';notice('正在录音…')}catch(e){stream?.getTracks().forEach(t=>t.stop());recordingPromise=null;notice('无法录音，请检查麦克风权限或上传音频。')}};
function ready(){if(pending||recordingPromise){notice('请先完成文件读取或录音。');return false}if(Object.keys(readErrors).length){notice('请重新选择读取失败的文件。');return false}return true}
$('preview').onclick=()=>{if(ready())render(collect())};
const encode=d=>{const b=new TextEncoder().encode(JSON.stringify(d));return btoa(Array.from(b,x=>String.fromCharCode(x)).join('')).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'')};
const decode=s=>JSON.parse(new TextDecoder().decode(Uint8Array.from(atob(s.replace(/-/g,'+').replace(/_/g,'/')),c=>c.charCodeAt(0))));
$('share').onclick=()=>{if(!ready())return;$('qr').replaceChildren();$('shareUrl').hidden=true;$('copyWrap').hidden=true;if(location.protocol!=='https:'){notice('请先通过 HTTPS 部署网站，再生成可扫码访问的链接。');return}const d=collect();if([...d.photos,d.music,d.voice].some(s=>s.startsWith('data:'))){notice('本地媒体不能直接放入二维码。请改用在线 HTTPS 媒体地址，或导出完整 HTML。');return}const url=location.href.split('#')[0]+'#card='+encode(d);$('shareUrl').value=url;$('shareUrl').hidden=false;$('copyWrap').hidden=false;notice('链接已生成。持有链接的人可以查看贺卡，请勿填写敏感信息。');if(url.length>1800){notice('链接已生成，但内容过长，无法可靠扫码。请缩短祝福或在线媒体地址。');return}try{if(!window.QRCode)throw Error();new QRCode($('qr'),{text:url,width:248,height:248,correctLevel:QRCode.CorrectLevel.L})}catch{notice('链接已生成，二维码组件未加载或容量不足，可以先复制链接。')}};
$('copy').onclick=async()=>{try{await navigator.clipboard.writeText($('shareUrl').value);notice('链接已复制。')}catch{$('shareUrl').select();notice('请长按链接复制。')}};
$('export').onclick=()=>{if(!ready())return;const d=collect(),clone=document.documentElement.cloneNode(true);clone.querySelector('#embedded').textContent=JSON.stringify(d).replace(/</g,'\\u003c');clone.querySelector('#qrlib')?.remove();clone.querySelector('#qr').replaceChildren();clone.querySelector('#gallery').replaceChildren();clone.querySelectorAll('audio').forEach(a=>a.removeAttribute('src'));const blob=new Blob(['<!doctype html>',clone.outerHTML],{type:'text/html;charset=utf-8'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='心意来信.html';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),10000);notice('完整贺卡已导出，包含所选本地媒体。文件本身不是公网链接。')};
let received=null;try{const embedded=JSON.parse($('embedded').textContent);if(embedded)received=embedded;else if(location.hash.startsWith('#card='))received=decode(location.hash.slice(6))}catch{notice('贺卡链接无效，请重新生成。')}if(received){document.body.classList.add('recipient');render(received)}else{render(collect())}
</script></body></html>
